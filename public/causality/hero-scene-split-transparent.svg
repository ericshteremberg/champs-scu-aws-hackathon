<svg xmlns="http://www.w3.org/2000/svg" width="612" height="560" viewBox="0 0 612 560" role="img" aria-labelledby="title desc"><title id="title">Scoped evidence access</title><desc id="desc">Stripe, email, and database sources pass through an independently approved permission gate. The investigator receives scoped evidence. Unrelated data stays behind. Illustrative architecture.</desc><defs>
 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F5F7"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".94"/><stop offset=".3" stop-color="#E3E7EC" stop-opacity=".72"/><stop offset=".65" stop-color="#FFFFFF" stop-opacity=".3"/><stop offset="1" stop-color="#CCD3DA" stop-opacity=".74"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#FFFFFF"/><stop offset=".22" stop-color="#CDD2D9"/><stop offset=".38" stop-color="#FFFFFF"/><stop offset=".67" stop-color="#7C838D"/><stop offset=".84" stop-color="#FDFEFF"/><stop offset="1" stop-color="#B4BAC1"/></linearGradient>
 <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFD0A0"/><stop offset=".4" stop-color="#F48120"/><stop offset="1" stop-color="#F4A156" stop-opacity=".15"/></linearGradient>
 <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F48120" stop-opacity="0"/><stop offset=".55" stop-color="#F48120" stop-opacity=".3"/><stop offset="1" stop-color="#F48120" stop-opacity="0"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#F9B77B" stop-opacity=".3"/><stop offset=".55" stop-color="#F9D5B5" stop-opacity=".13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
 <radialGradient id="floor"><stop stop-color="#BBC1CA" stop-opacity=".18"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-30%" y="-50%" width="170%" height="220%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#263140" flood-opacity=".10"/></filter>
 <filter id="gateShadow" x="-50%" y="-25%" width="220%" height="180%"><feDropShadow dx="18" dy="18" stdDeviation="14" flood-color="#596373" flood-opacity=".13"/></filter>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
 <filter id="smear" x="-10%" y="-100%" width="130%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
 <clipPath id="gateclip"><path d="M575 116 Q575 102 589 105L728 135Q738 137 738 149V367Q738 379 724 382L590 412Q575 415 575 400Z"/></clipPath>
 </defs><ellipse cx="323" cy="294" rx="286" ry="240" fill="url(#halo)"/><ellipse cx="316" cy="439" rx="285" ry="75" fill="url(#floor)"/><g stroke="#D6DAE0" stroke-width=".7" opacity=".35"><path d="M22 395L592 365"/><path d="M22 412L592 382"/><path d="M22 429L592 399"/><path d="M22 446L592 416"/><path d="M22 463L592 433"/><path d="M22 480L592 450"/><path d="M45 357L109 489"/><path d="M106 357L170 489"/><path d="M167 357L231 489"/><path d="M228 357L292 489"/><path d="M289 357L353 489"/><path d="M350 357L414 489"/><path d="M411 357L475 489"/><path d="M472 357L536 489"/><path d="M533 357L597 489"/></g><path d="M137 286C229 271 287 271 457 285" fill="none" stroke="url(#ray)" stroke-width="65" filter="url(#smear)"/><path id="route-0" d="M168 209C208 209 206 237 239 244" fill="none" stroke="#D1D6DE" stroke-width="1.5"/><path d="M168 209C208 209 206 237 239 244" fill="none" stroke="#F48120" stroke-width=".8" opacity=".35"/><path id="route-1" d="M168 289C202 289 209 278 239 283" fill="none" stroke="#D1D6DE" stroke-width="1.5"/><path d="M168 289C202 289 209 278 239 283" fill="none" stroke="#F48120" stroke-width=".8" opacity=".35"/><path id="route-2" d="M168 369C202 369 208 324 239 321" fill="none" stroke="#D1D6DE" stroke-width="1.5"/><path d="M168 369C202 369 208 324 239 321" fill="none" stroke="#F48120" stroke-width=".8" opacity=".35"/><g filter="url(#shadow)"><rect x="20" y="178" width="148" height="62" rx="16" fill="url(#card)" stroke="#D9DFE6"/></g><path d="M36 179H152" stroke="#FFF" stroke-width="2"/><g transform="translate(35 197)" fill="none" stroke="#6B737D" stroke-width="1.5" stroke-linejoin="round"><path d="M0 3h24v18H0z M0 9h24 M5 16h6"/></g><text x="70" y="215" fill="#181818" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">Stripe</text><circle cx="168" cy="209" r="3.5" fill="#FFF" stroke="#C6CDD6"/><g filter="url(#shadow)"><rect x="20" y="258" width="148" height="62" rx="16" fill="url(#card)" stroke="#D9DFE6"/></g