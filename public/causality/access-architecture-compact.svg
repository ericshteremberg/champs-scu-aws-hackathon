<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="title desc"><title id="title">Scoped investigation architecture</title><desc id="desc">Company policy independently controls a gate that scopes queries and filters fields. Approved evidence and tools enter a fresh case context. Audit logging remains outside that context.</desc><defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F5F7"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".52" stop-color="#F1F4F7"/><stop offset="1" stop-color="#E5E9EE"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#D7DDE5"/><stop offset=".45" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B7C1CD"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2F3C4E" flood-opacity=".07"/></filter>
<marker id="arrow" viewBox="0 0 6 8" refX="5" refY="4" markerWidth="4" markerHeight="6" orient="auto"><path d="M1 1L5 4L1 7" fill="none" stroke="#C77939" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<path d="M238 55V93" stroke="#A8B3C0" stroke-width="1.2" stroke-dasharray="3 4"/>
<path id="records-route" d="M138 166H164" fill="none" stroke="#D78A48" stroke-width="1.5" marker-end="url(#arrow)"/>
<path id="context-route" d="M312 166H336" fill="none" stroke="#D78A48" stroke-width="1.5" marker-end="url(#arrow)"/>
<path id="audit-route" d="M238 238V282" fill="none" stroke="#ADB7C3" stroke-width="1.2" stroke-dasharray="3 4"/>
<g filter="url(#shadow)"><rect x="151" y="16" width="174" height="40" rx="20" fill="#FFFFFF" stroke="#D8DFE7"/></g><path d="M167 35l4 4 7-9" fill="none" stroke="#B75B12" stroke-width="1.7" stroke-linecap="round"/>
<text x="188" y="42" fill="#181818" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">Company policy</text><g filter="url(#shadow)"><rect x="8" y="110" width="130" height="112" rx="20" fill="url(#card)" stroke="#D8DFE7"/></g>
<g transform="translate(24 127)" fill="none" stroke="#747E8B" stroke-width="1.4"><path d="M0 5c0-5 22-5 22 0s-22 5-22 0z M0 5v16c0 5 22 5 22 0V5 M0 13c0 5 22 5 22 0"/></g><text x="24" y="181" fill="#181818" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">Company</text><text x="24" y="202" fill="#181818" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">records</text><g filter="url(#shadow)"><rect x="164" y="94" width="148" height="144" rx="20" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/></g>
<rect x="168" y="98" width="140" height="136" rx="17" fill="none" stroke="#FFFFFF"/>
<path d="M181 140H295" stroke="#D6DDE5"/>
<path d="M181 154V218" stroke="#F48120" stroke-width="2" stroke-linecap="round"/>
<text x="180" y="124" fill="#181818" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">Policy gate</text><text x="191" y="174" fill="#555F6D" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Scope queries</text><text x="191" y="202" fill="#555F6D" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Filter fields</text><g filter="url(#shadow)"><rect x="336" y="94" width="136" height="144" rx="20" fill="url(#card)" stroke="#C5CED9" stroke-width="1.2"/></g>
<rect x="340" y="98" width="128" height="136" rx="17" fill="none" stroke="#FFFFFF"/>
<text x="352" y="124" fill="#181818" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">Fresh context</text><path d="M352 140H456" stroke="#D8DFE7"/><circle cx="358" cy="169" r="6" fill="#F48120"/><path d="M355 169l2 2 4-4" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/><text x="373" y="174" fill="#555F6D" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Evidence</text><circle cx="358" cy="197" r="6" fill="#F48120"/><path d="M355 197l2 2 4-4" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/><text x="373" y="202" fill="#555F6D" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Tools</text><rect x="168" y="282" width="140" height="42" rx="16" fill="#FFFFFF" stroke="#D8DFE7"/>
<g transform="translate(183 294)" fill="none" stroke="#7D8795" stroke-width="1.3"><path d="M0 0h12l4 4v15H0z M12 0v5h4 M4 9h8 M4 13h8"/></g><text x="211" y="309" fill="#181818" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">Audit log</text></svg>